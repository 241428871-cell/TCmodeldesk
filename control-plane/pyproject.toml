[project]
name = "model-desk-control"
version = "0.1.0"
description = "Native CLI orchestration contracts for Model Desk"
requires-python = ">=3.12"
dependencies = [
  "langgraph==1.2.16",
  "langgraph-checkpoint-sqlite>=3,<4",
  "pydantic>=2.12,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12", "basedpyright>=1.30"]
workbench = [
  "anyio==4.12.1",
  "mcp==1.30.0",
  "psutil==7.2.2",
  "tiktoken==0.12.0",
  "PyYAML==6.0.3",
  "keyring==25.6.0; sys_platform == 'darwin'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_desk_control"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
testpaths = ["tests"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
include = ["src", "tests"]
stubPath = "typings"
extraPaths = ["../.local-worker", "../.local-worker/tests"]
reportUnusedCallResult = "warning"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D203", "D213", "CPY001"]
# Intentional punctuation in the Chinese product interface.
allowed-confusables = ["，", "；", "："]

