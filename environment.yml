# Conda environment for offline development checks of the control plane and workbench.
# Versions mirror control-plane/uv.lock and requirements.txt as verified on macOS.
name: aad-control
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - langgraph==1.2.16
      - langgraph-checkpoint-sqlite==3.1.2
      - pydantic==2.14.1
      - anyio==4.12.1
      - mcp==1.30.0
      - psutil==7.2.2
      - tiktoken==0.12.0
      - PyYAML==6.0.3
      - keyring==25.6.0; sys_platform == "darwin"
      - pytest==9.1.1
      - ruff==0.17.1
      - basedpyright==1.40.2
      - -e ./control-plane
